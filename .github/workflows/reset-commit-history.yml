name: Reset Commit History

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to confirm — this permanently deletes all commit history'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RESET" ]; then
            echo "ERROR: You must type RESET exactly to confirm this destructive action."
            exit 1
          fi

      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup current branch as a tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          BACKUP_TAG="backup/pre-reset-$(date -u +%Y%m%d%H%M%S)"
          git tag "$BACKUP_TAG"
          git push origin "$BACKUP_TAG"
          echo "Backup tag created: $BACKUP_TAG"

      - name: Create clean commit
        run: |
          rm -rf .git
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Initial clean commit"

      - name: Force push to main
        run: |
          git branch -M main
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin main

      - name: Summary
        if: always()
        run: |
          echo "## Reset Commit History Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backup Tag | See 'Backup current branch as a tag' step output |" >> $GITHUB_STEP_SUMMARY
